services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: attendance_db
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
